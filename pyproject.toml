[project]
name = "deepagents-study"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=5.0.0",
    "casbin>=1.43.0",
    "deepagents",
    "fastapi>=0.138.0",
    "httpx[socks]>=0.28.1",
    "langchain-openai",
    "pgvector>=0.4.2",
    "psycopg[binary]>=3.3.4",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.51",
    "tavily-python",
    "uvicorn[standard]>=0.49.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["backend"]
pythonpath = ["backend"]  # 让测试里 `import app...` 可用,免去 sys.path hack
