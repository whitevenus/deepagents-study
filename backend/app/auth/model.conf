# Casbin 模型:RBAC(角色→操作)+ ABAC(行级数据范围)合一。
# r.sub=用户id  r.obj=资源  r.act=动作  r.owner=被操作对象的拥有者id
# p.scope = all(不限拥有者) | own(仅自己拥有的)
[request_definition]
r = sub, obj, act, owner

[policy_definition]
p = sub, obj, act, scope

[role_definition]
g = _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = g(r.sub, p.sub) && r.obj == p.obj && r.act == p.act && (p.scope == "all" || r.owner == r.sub)
